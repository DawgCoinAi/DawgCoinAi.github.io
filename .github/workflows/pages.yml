# Runs the test suite, then publishes dist/ (the playable game) to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sha256sum -c SHA256SUMS --quiet
      - run: npm test

  deploy:
    needs: test
    # The private source repo runs the tests only; the public Pages repo also deploys.
    if: github.repository == 'DawgCoinAi/DawgCoinAi.github.io'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Give every module and stylesheet a per-deploy address so browsers never mix builds.
      - run: node scripts/stamp-build.mjs dist ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
